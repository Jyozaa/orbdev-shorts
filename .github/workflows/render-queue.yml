name: Render queued stories

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'stories/queue/*.json'

permissions:
  contents: read

concurrency:
  group: orbdev-render-queue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      count: ${{ steps.queue.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve queued stories
        id: queue
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import glob, json, os, subprocess

          event = os.environ.get("EVENT_NAME")
          before = os.environ.get("BEFORE_SHA", "")
          after = os.environ.get("AFTER_SHA", "")
          files = []

          if event == "push" and before and set(before) != {"0"}:
              try:
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", before, after, "--", "stories/queue"],
                      text=True,
                  ).splitlines()
                  files = [path for path in changed if path.startswith("stories/queue/") and path.endswith(".json")]
              except subprocess.CalledProcessError:
                  files = []
          if event != "push":
              files = sorted(glob.glob("stories/queue/*.json"))

          files = sorted({path for path in files if os.path.isfile(path)})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(files, separators=(",", ":")) + "\n")
              output.write("count=" + str(len(files)) + "\n")
          print(f"Queued stories selected: {len(files)}")
          for path in files:
              print(" -", path)
          PY

  render:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        story: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBDEV_KOKORO_VOICE: am_michael
      ORBDEV_KOKORO_SPEED: '1.24'
      ORBDEV_VOICE_FALLBACK: en-US-BrianMultilingualNeural
      ORBDEV_VOICE_TERTIARY: en-US-AndrewMultilingualNeural
      ORBDEV_EDGE_RATE: +12%
      ORBDEV_CAPTION_LEAD_MS: 45
      ORBDEV_VOICE_TEMPO: '1.04'
      ORBDEV_SENTENCE_PAUSE_MS: 18

    steps:
      - name: Checkout application files
        uses: actions/checkout@v4

      - name: Resolve story metadata
        shell: bash
        env:
          STORY: ${{ matrix.story }}
        run: |
          slug="$(python -c 'import json,os; print(json.load(open(os.environ["STORY"], encoding="utf-8"))["slug"])')"
          echo "STORY_FILE=$STORY" >> "$GITHUB_ENV"
          echo "STORY_SLUG=$slug" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Node packages
        run: npm install

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Validate story
        run: python scripts/validate_story.py "$STORY_FILE"

      - name: Generate narration
        run: python scripts/generate_narration.py "$STORY_FILE"

      - name: Generate transition sound effects
        run: python scripts/generate_sfx.py

      - name: Build meme catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_meme_catalog.py

      - name: Select meme assets
        run: python scripts/select_memes.py "$STORY_FILE"

      - name: Insert narration-free meme cutaways
        run: python scripts/insert_cutaway_pauses.py

      - name: Capture source visuals
        run: python scripts/capture_sources.py "$STORY_FILE"

      - name: Capture animated logo assets
        run: python scripts/capture_logos.py "$STORY_FILE"

      - name: Prepare voice-timed render
        run: python scripts/prepare_render_props.py "$STORY_FILE"

      - name: Type check
        run: npm run typecheck

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render src/index.ts OrbdevShort "out/${STORY_SLUG}.mp4" \
            --props=build/render-props.json \
            --codec=h264 \
            --pixel-format=yuv420p \
            --concurrency=2 \
            --log=info

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbdev-${{ env.STORY_SLUG }}
          path: out/${{ env.STORY_SLUG }}.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload selection report
        uses: actions/upload-artifact@v4
        with:
          name: render-selection-${{ env.STORY_SLUG }}
          path: |
            build/meme-selection.json
            build/cutaways.json
            build/source-assets.json
            build/logo-assets.json
            build/render-props.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Install YouTube publishing dependencies
        if: ${{ vars.ORBDEV_AUTO_PUBLISH == 'true' }}
        run: python -m pip install -r requirements-publish.txt

      - name: Publish to YouTube
        if: ${{ vars.ORBDEV_AUTO_PUBLISH == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/publish_youtube.py "$STORY_FILE" "out/${STORY_SLUG}.mp4"
