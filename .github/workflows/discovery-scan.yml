name: Discovery scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/discover_news.py'
      - 'editorial/discovery.json'
      - 'editorial/policy.json'
      - 'requirements-discovery.txt'
      - '.github/workflows/discovery-scan.yml'

permissions:
  contents: write

concurrency:
  group: orbdev-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/
            editorial/
            history/
            scripts/
            stories/current.json
            requirements-discovery.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install discovery dependencies
        run: python -m pip install -r requirements-discovery.txt

      - name: Test discovery logic
        run: python scripts/test_discovery_logic.py

      - name: Run all discovery lanes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/discover_news.py \
            --config editorial/discovery.json \
            --policy editorial/policy.json \
            --covered history/covered.json \
            --state history/discovery-state.json \
            --current stories/current.json \
            --output build/discovery

      - name: Publish editorial inbox and discovery state
        shell: bash
        run: |
          cp build/discovery/qualified.json /tmp/orbdev-qualified.json
          cp build/discovery/next-state.json /tmp/orbdev-discovery-state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/orbdev-qualified.json editorial/inbox/latest.json
          cp /tmp/orbdev-discovery-state.json history/discovery-state.json
          git config user.name "orbdev-discovery[bot]"
          git config user.email "orbdev-discovery[bot]@users.noreply.github.com"
          git add editorial/inbox/latest.json history/discovery-state.json
          if git diff --cached --quiet; then
            echo "No discovery state changes to commit."
          else
            git commit -m "Update discovery inbox"
            git push origin HEAD:main || echo "::warning::Could not persist discovery inbox; artifact still contains the scan."
          fi

      - name: Write scan summary
        shell: bash
        run: cat build/discovery/scan-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: orbdev-discovery-${{ github.run_id }}
          path: |
            build/discovery/candidates.json
            build/discovery/clusters.json
            build/discovery/qualified.json
            build/discovery/scan-report.md
          if-no-files-found: error
          retention-days: 30
