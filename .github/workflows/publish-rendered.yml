name: Publish rendered Orbdev video

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID containing the rendered orbdev-<slug> artifact
        required: true
      story_file:
        description: Exact story JSON path, e.g. stories/queue/2026-10-05-example.json
        required: true
  push:
    branches:
      - main
    paths:
      - 'publish/requests/*.json'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            publish/requests
            stories/queue
            scripts
            requirements-publish.txt
            history
          sparse-checkout-cone-mode: false

      - name: Resolve publish request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_STORY_FILE: ${{ inputs.story_file }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          event = os.environ.get("EVENT_NAME")
          if event == "workflow_dispatch":
              source_run_id = str(os.environ.get("INPUT_SOURCE_RUN_ID") or "").strip()
              story_file = str(os.environ.get("INPUT_STORY_FILE") or "").strip()
          else:
              before = os.environ.get("BEFORE_SHA", "")
              after = os.environ.get("AFTER_SHA", "")
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", before, after, "--", "publish/requests"],
                  text=True,
              ).splitlines()
              requests = [p for p in changed if p.endswith(".json") and Path(p).is_file()]
              if len(requests) != 1:
                  raise SystemExit(f"expected exactly one changed publish request, got {len(requests)}: {requests}")
              req = json.loads(Path(requests[0]).read_text(encoding="utf-8"))
              source_run_id = str(req.get("sourceRunId") or "").strip()
              story_file = str(req.get("storyFile") or "").strip()

          if not source_run_id.isdigit():
              raise SystemExit("source run id must be numeric")
          if not story_file.startswith("stories/queue/") or not story_file.endswith(".json"):
              raise SystemExit("story_file must point to stories/queue/*.json")
          if not Path(story_file).is_file():
              raise SystemExit(f"story file not found: {story_file}")

          story = json.loads(Path(story_file).read_text(encoding="utf-8"))
          slug = str(story.get("slug") or "").strip()
          if not slug:
              raise SystemExit("story is missing slug")

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"source_run_id={source_run_id}\n")
              f.write(f"story_file={story_file}\n")
              f.write(f"slug={slug}\n")

          print("Source run:", source_run_id)
          print("Story:", story_file)
          print("Slug:", slug)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-publish.txt

      - name: Download existing rendered MP4
        uses: actions/download-artifact@v4
        with:
          name: orbdev-${{ steps.request.outputs.slug }}
          path: out
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: python -m pip install -r requirements-publish.txt

      - name: Publish to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_RESULT_PATH: build/youtube-result.json
          STORY_FILE: ${{ steps.request.outputs.story_file }}
          STORY_SLUG: ${{ steps.request.outputs.slug }}
        run: python scripts/publish_youtube.py "$STORY_FILE" "out/${STORY_SLUG}.mp4"

      - name: Write publish receipt
        env:
          STORY_PATH: ${{ steps.request.outputs.story_file }}
        run: |
          mkdir -p build/receipt
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          s=json.load(open(os.environ["STORY_PATH"],encoding="utf-8"));e=s["editorial"]
          yt=json.load(open("build/youtube-result.json",encoding="utf-8"))
          r={"storyKey":e["storyKey"],"slug":s["slug"],"headline":s["title"],"selectedAt":e["selectedAt"],"score":e["score"],"sourceUrls":[x["url"] for x in e["sources"] if x.get("primary")],"renderedAt":datetime.now(timezone.utc).isoformat(),"youtubeUrl":yt.get("url"),"youtubeVideoId":yt.get("videoId"),"youtubeTitle":yt.get("title") or (s.get("publish") or {}).get("youtubeTitle"),"metadataVersion":(s.get("publish") or {}).get("metadataVersion"),"metadataReview":(s.get("publish") or {}).get("metadataReview")}
          json.dump(r,open(f"build/receipt/{s['slug']}.json","w"),indent=2)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: publish-receipt-${{ steps.request.outputs.slug }}
          path: build/receipt/${{ steps.request.outputs.slug }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Mark story covered
        env:
          SLUG: ${{ steps.request.outputs.slug }}
        run: |
          python scripts/mark_covered.py --receipts-dir build/receipt --covered history/covered.json --output /tmp/covered.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/covered.json history/covered.json
          git config user.name "orbdev-publish[bot]"
          git config user.email "orbdev-publish[bot]@users.noreply.github.com"
          git add history/covered.json
          if ! git diff --cached --quiet; then
            git commit -m "Mark published Orbdev story covered: ${SLUG}"
            git push origin HEAD:main
          fi
