name: Render short

on:
  workflow_dispatch:
    inputs:
      story:
        description: Story JSON path
        required: false
        default: stories/test.json
  push:
    branches:
      - main
    paths:
      - 'stories/current.json'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'requirements.txt'
      - '.github/workflows/render-short.yml'

permissions:
  contents: read

concurrency:
  group: orbdev-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORBDEV_VOICE: en-GB-RyanNeural
      ORBDEV_RATE: +10%

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve story
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            story="${{ inputs.story }}"
          elif [ -f stories/current.json ]; then
            story="stories/current.json"
          else
            story="stories/test.json"
          fi

          slug="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["slug"])' "$story")"
          echo "STORY_FILE=$story" >> "$GITHUB_ENV"
          echo "STORY_SLUG=$slug" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Node packages
        run: npm install

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Validate story
        run: python scripts/validate_story.py "$STORY_FILE"

      - name: Generate narration
        run: python scripts/generate_narration.py "$STORY_FILE"

      - name: Generate sound effects
        run: python scripts/generate_sfx.py

      - name: Prepare render
        run: python scripts/prepare_render_props.py "$STORY_FILE"

      - name: Type check
        run: npm run typecheck

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render src/index.ts OrbdevShort "out/${STORY_SLUG}.mp4" \
            --props=build/render-props.json \
            --codec=h264 \
            --pixel-format=yuv420p \
            --concurrency=2 \
            --log=info

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: orbdev-${{ env.STORY_SLUG }}
          path: out/${{ env.STORY_SLUG }}.mp4
          if-no-files-found: error
          retention-days: 30
