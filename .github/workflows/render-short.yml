name: Render short

on:
  workflow_dispatch:
    inputs:
      story:
        description: Story JSON path
        required: false
        default: stories/test.json
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'stories/test.json'
      - 'package.json'
      - 'requirements.txt'
      - '.github/workflows/render-short.yml'

permissions:
  contents: read

concurrency:
  group: render-short-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORY_FILE: ${{ github.event.inputs.story || 'stories/test.json' }}
      ORBDEV_VOICE: en-GB-RyanNeural
      ORBDEV_RATE: +8%

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Node packages
        run: npm install

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Validate story
        run: python scripts/validate_story.py "$STORY_FILE"

      - name: Generate narration
        run: python scripts/generate_narration.py "$STORY_FILE"

      - name: Prepare render
        run: python scripts/prepare_render_props.py "$STORY_FILE"

      - name: Type check
        run: npm run typecheck

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render src/index.ts OrbdevShort out/orbdev-short.mp4 \
            --props=build/render-props.json \
            --codec=h264 \
            --pixel-format=yuv420p \
            --concurrency=2 \
            --log=info

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: orbdev-short
          path: out/orbdev-short.mp4
          if-no-files-found: error
          retention-days: 7
