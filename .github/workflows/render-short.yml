name: Render short

on:
  workflow_dispatch:
    inputs:
      story:
        description: Story JSON path
        required: false
        default: stories/current.json
  push:
    branches:
      - main
    paths:
      - 'stories/current.json'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'requirements.txt'
      - '.github/workflows/render-short.yml'

permissions:
  contents: read

concurrency:
  group: orbdev-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORBDEV_VOICE: en-US-BrianMultilingualNeural
      ORBDEV_VOICE_FALLBACK: en-US-AndrewMultilingualNeural
      ORBDEV_VOICE_TERTIARY: en-US-AndrewNeural
      ORBDEV_RATE: +8%
      ORBDEV_PITCH: +0Hz
      ORBDEV_CAPTION_LEAD_MS: 80

    steps:
      - name: Checkout application files
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/
            editorial/
            history/
            public/
            scripts/
            src/
            stories/
            package.json
            requirements.txt
            tsconfig.json
            README.md

      - name: Resolve story
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            story="${{ inputs.story }}"
          else
            story="stories/current.json"
          fi
          slug="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["slug"])' "$story")"
          echo "STORY_FILE=$story" >> "$GITHUB_ENV"
          echo "STORY_SLUG=$slug" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Node packages
        run: npm install

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Validate story
        run: python scripts/validate_story.py "$STORY_FILE"

      - name: Generate narration
        run: python scripts/generate_narration.py "$STORY_FILE"

      - name: Generate transition sound effects
        run: python scripts/generate_sfx.py

      - name: Build meme catalog from this repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_meme_catalog.py

      - name: Select meme assets
        run: python scripts/select_memes.py "$STORY_FILE"

      - name: Insert narration-free meme cutaways
        run: python scripts/insert_cutaway_pauses.py

      - name: Capture source visuals
        run: python scripts/capture_sources.py "$STORY_FILE"

      - name: Capture animated logo assets
        run: python scripts/capture_logos.py "$STORY_FILE"

      - name: Prepare voice-timed render
        run: python scripts/prepare_render_props.py "$STORY_FILE"

      - name: Type check
        run: npm run typecheck

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render src/index.ts OrbdevShort "out/${STORY_SLUG}.mp4" \
            --props=build/render-props.json \
            --codec=h264 \
            --pixel-format=yuv420p \
            --concurrency=2 \
            --log=info

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: orbdev-${{ env.STORY_SLUG }}
          path: out/${{ env.STORY_SLUG }}.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload selection report
        uses: actions/upload-artifact@v4
        with:
          name: render-selection-${{ env.STORY_SLUG }}
          path: |
            build/meme-selection.json
            build/cutaways.json
            build/source-assets.json
            build/logo-assets.json
            build/render-props.json
          if-no-files-found: ignore
          retention-days: 30
