name: Meme context preview

on:
  push:
    branches:
      - fix/context-aware-meme-selection
    paths:
      - '.github/workflows/meme-context-preview.yml'

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/
            stories/
            Meme Pack/
            Memes templates -HD-/
            Memes templates -HD- 2/
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build catalog and select current-story memes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_meme_catalog.py
          python scripts/select_memes.py stories/current.json
          python - <<'PY'
          import json
          story=json.load(open("stories/current.json",encoding="utf-8"))
          selected=json.load(open("build/meme-selection.json",encoding="utf-8"))
          for key,item in selected.items():
              i=int(key)
              print(json.dumps({
                  "beat":i,
                  "narration":story["beats"][i]["text"],
                  "meme":item.get("sourcePath"),
                  "score":item.get("score"),
                  "contextMatches":item.get("contextMatches"),
                  "intentSource":item.get("intentSource"),
              },ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: meme-context-selection
          path: |
            build/meme-selection.json
            build/meme-catalog.json
          retention-days: 7
